<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Reconocimiento de Famosos - Demo</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>

        body{
            background:#f5f5f5;
        }

        .card{
            margin-top:40px;
        }

        #preview{
            max-height:350px;
            display:none;
        }

    </style>

</head>

<body>

<div class="container">

    <div class="card shadow">

        <div class="card-header bg-primary text-white">

            <h3>Reconocimiento de Famosos</h3>
            <small>Versión DEMO</small>

        </div>

        <div class="card-body">

            <input
                    class="form-control"
                    type="file"
                    id="imagen">

            <br>

            <img id="preview" class="img-fluid rounded">

            <br><br>

            <button
                    class="btn btn-success"
                    onclick="analizar()">

                Analizar Imagen

            </button>

            <hr>

            <h4>Resultado</h4>

            <table class="table table-bordered">

                <thead>

                <tr>

                    <th>Famoso</th>
                    <th>Confianza</th>

                </tr>

                </thead>

                <tbody id="resultado">

                </tbody>

            </table>

        </div>

    </div>

</div>

<script>

const imagen=document.getElementById("imagen");
const preview=document.getElementById("preview");

imagen.onchange=function(){

    const reader=new FileReader();

    reader.onload=function(e){

        preview.src=e.target.result;
        preview.style.display="block";

    }

    reader.readAsDataURL(imagen.files[0]);

}

function analizar(){

    let tabla=document.getElementById("resultado");

    tabla.innerHTML="";

    const famosos=[

        {
            nombre:"Elon Musk",
            confianza:"99.15%"
        },

        {
            nombre:"Bill Gates",
            confianza:"95.60%"
        }

    ];

    famosos.forEach(f=>{

        tabla.innerHTML+=`

            <tr>

                <td>${f.nombre}</td>

                <td>${f.confianza}</td>

            </tr>

        `;

    });

}

</script>

</body>
</html>
